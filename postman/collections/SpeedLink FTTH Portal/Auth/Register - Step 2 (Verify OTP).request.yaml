$kind: http-request
name: 'Register - Step 2 (Verify OTP)'
method: POST
url: '{{baseUrl}}/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "{{testUserName}}",
      "email": "{{testUserEmail}}",
      "phoneNumber": "{{testUserPhone}}",
      "password": "{{testUserPassword}}",
      "otp": "{{otpCode}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("User created successfully", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.user).to.have.property("id");
        pm.expect(json.user.email).to.eql(pm.environment.get("testUserEmail"));
        pm.expect(json.user).to.not.have.property("password");
      });
      pm.test("JWT cookie is set", () => {
        pm.expect(pm.cookies.has("jwt")).to.be.true;
      });
