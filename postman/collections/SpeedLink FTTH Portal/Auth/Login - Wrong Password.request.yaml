$kind: http-request
name: 'Login - Wrong Password'
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testUserEmail}}",
      "password": "WrongPassword999"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", () => pm.response.to.have.status(401));
      pm.test("Invalid credentials error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("Invalid credentials");
      });
