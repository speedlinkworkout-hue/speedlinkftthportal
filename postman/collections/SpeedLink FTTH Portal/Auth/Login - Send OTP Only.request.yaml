$kind: http-request
name: 'Login - Send OTP Only'
method: POST
url: '{{baseUrl}}/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testUserEmail}}",
      "sendOTPOnly": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("requiresOTP is true", () => {
        const json = pm.response.json();
        pm.expect(json.requiresOTP).to.be.true;
        pm.expect(json.email).to.eql(pm.environment.get("testUserEmail"));
      });
      pm.test("devOTP captured if present", () => {
        const json = pm.response.json();
        if (json.devOTP) {
          pm.environment.set("otpCode", json.devOTP);
        }
      });
