$kind: http-request
name: 'Reset Password - Invalid OTP'
method: POST
url: '{{baseUrl}}/auth/reset-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testUserEmail}}",
      "otp": "000000",
      "newPassword": "NewPass@5678"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Invalid OTP error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.exist;
      });
