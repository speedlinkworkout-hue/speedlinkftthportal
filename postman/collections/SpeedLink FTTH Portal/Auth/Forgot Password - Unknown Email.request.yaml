$kind: http-request
name: 'Forgot Password - Unknown Email'
method: POST
url: '{{baseUrl}}/auth/forgot-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody@unknown.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("User not found error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("not found");
      });
