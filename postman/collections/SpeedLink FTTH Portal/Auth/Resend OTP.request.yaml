$kind: http-request
name: 'Resend OTP'
method: POST
url: '{{baseUrl}}/auth/resend-otp'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testUserEmail}}",
      "type": "verification",
      "name": "{{testUserName}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("New OTP sent", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.message).to.include("verification code");
      });
      pm.test("devOTP captured if present", () => {
        const json = pm.response.json();
        if (json.devOTP) {
          pm.environment.set("otpCode", json.devOTP);
        }
      });
