$kind: http-request
name: 'Verify Payment - Missing Reference'
method: POST
url: '{{baseUrl}}/plans/purchase/verify'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Reference required error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("reference");
      });
