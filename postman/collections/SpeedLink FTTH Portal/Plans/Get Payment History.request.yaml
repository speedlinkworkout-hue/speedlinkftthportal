$kind: http-request
name: 'Get Payment History'
method: GET
url: '{{baseUrl}}/plans/payments/history'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns payments array", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.payments).to.be.an("array");
        pm.expect(json).to.have.property("count");
      });
      pm.test("Payments sorted newest first", () => {
        const json = pm.response.json();
        if (json.payments.length > 1) {
          const dates = json.payments.map(p => new Date(p.createdAt).getTime());
          for (let i = 0; i < dates.length - 1; i++) {
            pm.expect(dates[i]).to.be.at.least(dates[i + 1]);
          }
        }
      });
