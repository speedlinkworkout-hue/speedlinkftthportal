$kind: http-request
name: 'Get Plan - Invalid ID'
method: GET
url: '{{baseUrl}}/plans/plan_nonexistent'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Plan not found error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("not found");
      });
