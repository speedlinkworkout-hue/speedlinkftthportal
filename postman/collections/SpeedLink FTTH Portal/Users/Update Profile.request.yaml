$kind: http-request
name: 'Update Profile'
method: PUT
url: '{{baseUrl}}/users/profile'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Updated Test User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Profile updated", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.user.fullName).to.eql("Updated Test User");
        pm.expect(json.user).to.have.all.keys("id", "fullName", "email", "phoneNumber", "role");
      });
