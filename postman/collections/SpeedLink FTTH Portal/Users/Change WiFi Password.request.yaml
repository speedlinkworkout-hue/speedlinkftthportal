$kind: http-request
name: 'Change WiFi Password'
method: PUT
url: '{{baseUrl}}/users/connections/{{connectionId}}/wifi-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "wifiPassword": "NewWifi@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("WiFi password changed", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.message).to.include("WiFi password changed");
      });
