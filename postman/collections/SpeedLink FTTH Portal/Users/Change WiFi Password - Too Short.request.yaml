$kind: http-request
name: 'Change WiFi Password - Too Short'
method: PUT
url: '{{baseUrl}}/users/connections/{{connectionId}}/wifi-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "wifiPassword": "short"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Password too short error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("8 characters");
      });
