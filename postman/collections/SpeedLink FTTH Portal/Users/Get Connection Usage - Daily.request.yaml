$kind: http-request
name: 'Get Connection Usage - Daily'
method: GET
url: '{{baseUrl}}/users/connections/{{connectionId}}/usage?period=daily'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns daily usage (last 7 days)", () => {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.period).to.eql("daily");
        pm.expect(json.usage).to.be.an("array");
        pm.expect(json.usage.length).to.be.at.most(7);
      });
