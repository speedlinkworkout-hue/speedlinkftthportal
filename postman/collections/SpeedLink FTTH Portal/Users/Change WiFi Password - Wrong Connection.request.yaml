$kind: http-request
name: 'Change WiFi Password - Wrong Connection'
method: PUT
url: '{{baseUrl}}/users/connections/000000000000000000000000/wifi-password'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "wifiPassword": "ValidPass@123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Connection not found error", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("not found");
      });
